[package]
name = "sentinel-node-axum"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "No B (axum) da aplicacao da Operacao Sentinel (FEELT37802 - Sistemas Distribuidos)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }

[profile.release]
opt-level = 2
strip = true
