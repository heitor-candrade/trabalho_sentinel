worker_processes auto;
pid /tmp/nginx.pid;

events {
worker_connections 1024;
}

http {
# --------------------------------------------------------------------------
# 1. log_format
# O QUE FAZ: Define um formato de log estruturado em pares chave=valor
# enviado para stdout, incluindo o identificador único da requisição
# ($request_id), o nó selecionado ($upstream_http_x_node), os endereços
# tentados ($upstream_addr), os códigos HTTP de cada tentativa
# ($upstream_status) e o tempo total ($request_time).
# O QUE ACONTECE SEM ELA: O Nginx usa o formato "combined" padrão, que
# omite o request_id, os retries (múltiplas entradas em upstream_status) e
# qual instância Rust atendeu cada chamada, inviabilizando o rastreamento
# distribuído e os scripts de auditoria (status.sh --usuario).
# --------------------------------------------------------------------------
log_format sentinel '$time_iso8601 nginx INFO '
'request_id=$request_id '
'client=$remote_addr '
'method=$request_method '
'uri=$request_uri '
'status=$status '
'node=$upstream_http_x_node '
'upstream=$upstream_addr '
'upstream_status=$upstream_status '
'req_time=$request_time';

access_log /dev/stdout sentinel;
error_log  /dev/stderr warn;

# --------------------------------------------------------------------------
# 2. upstream + max_fails / fail_timeout
# O QUE FAZ: Agrupa os nós heterogêneos (rust-a em Actix e rust-b em Axum)
# sob balanceamento Round Robin. Com max_fails=3 e fail_timeout=10s, se um
# nó acumular 3 falhas dentro de uma janela de 10 segundos, o Nginx o
# remove temporariamente da rotação por 10 segundos antes de voltar a
# testá-lo.
# O QUE ACONTECE SEM ELAS: O padrão do Nginx é max_fails=1 e fail_timeout=10s
# (ou, se max_fails=0 for definido, a detecção passiva é desativada). Sem
# essa proteção, o proxy continuaria enviando 50% das requisições para um
# nó morto, impondo a penalidade de timeout a cada duas requisições de
# clientes de forma indefinida.
# --------------------------------------------------------------------------
upstream rust_pool {
    server rust-a:8080 max_fails=3 fail_timeout=10s;
    server rust-b:8080 max_fails=3 fail_timeout=10s;
}

# Servidor principal exposto ao usuário (porta 80 interna -> 8080 no host)
server {
    listen 80;
    server_name _;

    # Endpoint interno de saúde do próprio Nginx (usado pelo Docker HEALTHCHECK)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----------------------------------------------------------------------
    # 3. Blocos que devolvem 404 (/admin/ e /metrics)
    # O QUE FAZEM: Interceptam externamente qualquer tentativa de acesso às
    # rotas administrativas (/admin/*) e de telemetria interna (/metrics),
    # retornando HTTP 404 diretamente no proxy antes de atingir os nós Rust.
    # O QUE ACONTECE SEM ELES: Qualquer usuário externo na porta 8080
    # conseguiria consultar métricas internas ou invocar comandos de controle
    # como /admin/ready?v=0 e /admin/atraso, comprometendo a segurança e a
    # disponibilidade do cluster.
    # ----------------------------------------------------------------------
    location ^~ /admin/ {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    # Rota principal balanceada para os nós Rust
    location / {
        proxy_pass http://rust_pool;
        proxy_http_version 1.1;

        # Propagação de contexto e rastreamento distribuído
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id      $request_id;
        add_header       X-Request-Id      $request_id always;

        # ------------------------------------------------------------------
        # 4. Os três proxy_*_timeout (connect, send e read)
        # O QUE FAZEM:
        # - proxy_connect_timeout 1s: limite para estabelecer o handshake TCP
        #   com o nó Rust.
        # - proxy_send_timeout 3s: limite entre duas operações de escrita ao
        #   enviar a requisição ao upstream.
        # - proxy_read_timeout 3s: limite de espera pela resposta do upstream
        #   após o envio da requisição.
        # O QUE ACONTECE SEM ELES: O padrão do Nginx é 60 segundos para cada
        # timeout. Em caso de nó parado ou travado, os workers do Nginx
        # ficariam bloqueados por até 1 minuto por requisição, esgotando o
        # pool de conexões e causando indisponibilidade em cascata (failover
        # extremamente lento).
        # ------------------------------------------------------------------
        proxy_connect_timeout 1s;
        proxy_send_timeout    3s;
        proxy_read_timeout    3s;

        # ------------------------------------------------------------------
        # 5. proxy_next_upstream e proxy_next_upstream_tries
        # O QUE FAZEM: Determinam que, diante de erro de rede, timeout ou
        # respostas HTTP 502/503 de um nó, o Nginx deve repetir a requisição
        # em outro nó saudável do pool (máximo de 2 tentativas totais),
        # aplicando-se apenas a métodos idempotentes (como GET e HEAD).
        # O QUE ACONTECE SEM ELAS: Qualquer falha pontual ou queda súbita de
        # um nó resultaria em erro HTTP 502/504 exposto diretamente ao
        # cliente final, derrubando a disponibilidade percebida mesmo com o
        # segundo nó operando normalmente.
        # ------------------------------------------------------------------
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}

# Servidor interno de métricas básicas do Nginx (somente rede interna 10.9.8.0/24)
server {
    listen 8081;
    location /stub_status {
        stub_status;
        access_log off;
    }
}


}